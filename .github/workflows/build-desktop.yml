name: Build Wails v2 and v3 packages

on:
  workflow_dispatch:
    inputs:
      v3_ref:
        description: 'v3 分支、标签或提交'
        required: true
        default: master
        type: string
      v2_ref:
        description: 'v2 分支、标签或提交'
        required: true
        default: wailsv2
        type: string

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.wails }} / ${{ matrix.os }} / amd64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        wails: [v2, v3]
        os: [windows-2022, ubuntu-22.04, ubuntu-24.04]
    defaults:
      run:
        shell: bash
    env:
      CI: 'true'
      # Pin build tools; Wails CLI and Go versions come from the selected go.mod.
      TASK_VERSION: v3.51.1
      WAILS_MAJOR: ${{ matrix.wails }}
      BUILD_OS: ${{ matrix.os }}
      GIT_COMMITTER_NAME: ${{ github.repository_owner }}
      GIT_COMMITTER_EMAIL: ${{ github.repository_owner }}@users.noreply.github.com

    steps:
      - name: Checkout selected version and pinned public submodules
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.wails == 'v3' && inputs.v3_ref || inputs.v2_ref }}
          submodules: recursive
          # Without ssh-key, checkout converts GitHub SSH submodule URLs to HTTPS.
          persist-credentials: false

      - name: Set up Go from go.mod
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
          run_install: false

      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache frontend dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-11-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-${{ runner.arch }}-11-

      - name: Install Linux build and packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config python3 dpkg-dev binutils
          if [[ "$WAILS_MAJOR" == v3 && "$BUILD_OS" == ubuntu-24.04 ]]; then
            sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev
          else
            sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev
          fi

      - name: Install Windows installer tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $nsisPath = Join-Path ${env:ProgramFiles(x86)} 'NSIS'
          if (-not (Test-Path (Join-Path $nsisPath 'makensis.exe'))) {
            choco install nsis --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed' }
          }
          if (-not (Test-Path (Join-Path $nsisPath 'makensis.exe'))) {
            throw 'makensis.exe was not found after installing NSIS'
          }
          $nsisPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Task and matching Wails CLI
        run: |
          go install "github.com/go-task/task/v3/cmd/task@$TASK_VERSION"
          wails_module="github.com/wailsapp/wails/$WAILS_MAJOR"
          wails_version=$(go list -m -f '{{.Version}}' "$wails_module")
          if [[ "$WAILS_MAJOR" == v3 ]]; then
            go install "$wails_module/cmd/wails3@$wails_version"
          else
            go install "$wails_module/cmd/wails@$wails_version"
          fi
          task --version
          {
            echo "### $WAILS_MAJOR / $BUILD_OS / amd64"
            echo "- Backend commit: $(git rev-parse HEAD)"
            echo "- Frontend commit: $(git -C frontend rev-parse HEAD)"
            echo "- Wails CLI: $wails_version"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build executable and installer
        run: |
          if [[ "$WAILS_MAJOR" == v2 ]]; then
            task build:package
          elif [[ "$RUNNER_OS" == Windows ]]; then
            task package
          else
            # Taskfile selects GTK3 for 22.04 and GTK4 for 24.04.
            task linux:create:deb
          fi

      - name: Check frontend types
        working-directory: frontend
        run: pnpm run type-check

      - name: Collect Windows EXE and NSIS installer
        if: runner.os == 'Windows'
        run: |
          output=bin
          if [[ "$WAILS_MAJOR" == v2 ]]; then output=build/bin; fi
          executable="$output/antdv-next-admin-thin-wails.exe"
          installer="$output/antdv-next-admin-thin-wails-amd64-installer.exe"
          test -s "$executable"
          test -s "$installer"
          mkdir -p artifacts
          cp "$executable" "artifacts/$WAILS_MAJOR-windows-amd64.exe"
          cp "$installer" "artifacts/$WAILS_MAJOR-windows-amd64-installer.exe"

      - name: Check deb and collect Linux executable
        if: runner.os == 'Linux'
        run: |
          output=bin
          if [[ "$WAILS_MAJOR" == v2 ]]; then output=build/bin; fi
          executable="$output/antdv-next-admin-thin-wails"
          test -s "$executable"
          test -x "$executable"
          readelf -h "$executable"
          shopt -s nullglob
          packages=("$output"/*.deb)
          if [[ ${#packages[@]} -ne 1 ]]; then
            echo "Expected exactly one deb, found ${#packages[@]}" >&2
            exit 1
          fi
          dpkg-deb --info "${packages[0]}"
          dpkg-deb --contents "${packages[0]}"
          mkdir -p artifacts
          cp "${packages[0]}" "artifacts/$WAILS_MAJOR-$BUILD_OS-amd64.deb"
          # GitHub artifact ZIPs do not preserve executable permissions.
          tar -czf "artifacts/$WAILS_MAJOR-$BUILD_OS-amd64-standalone.tar.gz" \
            -C "$output" antdv-next-admin-thin-wails

      - name: Upload both standalone and installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.wails }}-${{ matrix.os }}-amd64
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
