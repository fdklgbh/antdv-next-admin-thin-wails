name: 构建 Wails v2 和 v3 安装包

on:
  workflow_dispatch:
    inputs:
      v3_ref:
        description: 'v3 分支、标签或提交'
        required: true
        default: master
        type: string
      v2_ref:
        description: 'v2 分支、标签或提交'
        required: true
        default: wailsv2
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  build:
    name: 构建 ${{ matrix.wails }} / ${{ matrix.os }} / amd64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        wails: [v2, v3]
        os: [windows-2022, ubuntu-22.04, ubuntu-24.04]
    defaults:
      run:
        shell: bash
    env:
      CI: 'true'
      # 固定构建工具版本；Wails CLI 和 Go 版本取自所选代码的 go.mod。
      TASK_VERSION: v3.51.1
      WAILS_MAJOR: ${{ matrix.wails }}
      BUILD_OS: ${{ matrix.os }}
      GIT_COMMITTER_NAME: ${{ github.repository_owner }}
      GIT_COMMITTER_EMAIL: ${{ github.repository_owner }}@users.noreply.github.com

    steps:
      - name: 检出指定版本及固定提交的公开子模块
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.wails == 'v3' && inputs.v3_ref || inputs.v2_ref }}
          submodules: recursive
          # 未提供 ssh-key 时，checkout 会将 GitHub 子模块的 SSH 地址转换为 HTTPS。
          persist-credentials: false

      - name: 按 go.mod 配置 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 配置 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
          run_install: false

      - name: 获取 pnpm 缓存目录
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: 缓存前端依赖
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-11-${{ hashFiles('frontend/pnpm-lock.yaml', 'frontend/pnpm-workspace.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-${{ runner.arch }}-11-

      - name: 安装 Linux 构建和打包依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config python3 dpkg-dev binutils
          if [[ "$WAILS_MAJOR" == v3 && "$BUILD_OS" == ubuntu-24.04 ]]; then
            sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev
          else
            sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev
          fi

      - name: 安装 Windows 安装包工具
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $nsisPath = Join-Path ${env:ProgramFiles(x86)} 'NSIS'
          if (-not (Test-Path (Join-Path $nsisPath 'makensis.exe'))) {
            choco install nsis --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'NSIS 安装失败' }
          }
          if (-not (Test-Path (Join-Path $nsisPath 'makensis.exe'))) {
            throw '安装 NSIS 后未找到 makensis.exe'
          }
          $nsisPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: 安装 Task 和匹配版本的 Wails CLI
        run: |
          go install "github.com/go-task/task/v3/cmd/task@$TASK_VERSION"
          wails_module="github.com/wailsapp/wails/$WAILS_MAJOR"
          wails_version=$(go list -m -f '{{.Version}}' "$wails_module")
          if [[ "$WAILS_MAJOR" == v3 ]]; then
            if [[ "$BUILD_OS" == ubuntu-22.04 ]]; then
              # CLI 本身也会编译 Linux 图形依赖，必须与已安装的 GTK3 开发库匹配。
              go install -tags gtk3 "$wails_module/cmd/wails3@$wails_version"
            else
              go install "$wails_module/cmd/wails3@$wails_version"
            fi
          else
            go install "$wails_module/cmd/wails@$wails_version"
          fi
          task --version
          {
            echo "### $WAILS_MAJOR / $BUILD_OS / amd64"
            echo "- 后端提交： $(git rev-parse HEAD)"
            echo "- 前端提交： $(git -C frontend rev-parse HEAD)"
            echo "- Wails CLI 版本： $wails_version"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 按锁文件安装前端依赖
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: 构建单文件程序和安装包
        run: |
          if [[ "$WAILS_MAJOR" == v2 ]]; then
            task build:package
          elif [[ "$RUNNER_OS" == Windows ]]; then
            task package
          else
            # Taskfile 为 Ubuntu 22.04 选择 GTK3，为 24.04 选择 GTK4。
            task linux:create:deb
          fi

      - name: 检查前端类型
        working-directory: frontend
        run: pnpm run type-check

      - name: 收集 Windows 单文件 EXE 和 NSIS 安装包
        if: runner.os == 'Windows'
        run: |
          output=bin
          executable_name=antdv-next-admin-thin-wails
          installer_name=antdv-next-admin-thin-wails
          if [[ "$WAILS_MAJOR" == v2 ]]; then
            output=build/bin
            executable_name=$(node -p "require('./wails.json').outputfilename.replace(/\\.exe$/i, '')")
            installer_name=$(node -p "require('./wails.json').name")
          fi
          executable="$output/$executable_name.exe"
          installer="$output/$installer_name-amd64-installer.exe"
          for file in "$executable" "$installer"; do
            if [[ ! -s "$file" ]]; then
              echo "缺少构建产物：$file" >&2
              ls -la "$output"
              exit 1
            fi
          done
          mkdir -p artifacts
          cp "$executable" "artifacts/$WAILS_MAJOR-windows-amd64.exe"
          cp "$installer" "artifacts/$WAILS_MAJOR-windows-amd64-installer.exe"

      - name: 检查 deb 并收集 Linux 单文件程序
        if: runner.os == 'Linux'
        run: |
          output=bin
          executable_name=antdv-next-admin-thin-wails
          if [[ "$WAILS_MAJOR" == v2 ]]; then
            output=build/bin
            executable_name=$(node -p "require('./wails.json').outputfilename")
          fi
          executable="$output/$executable_name"
          if [[ ! -s "$executable" || ! -x "$executable" ]]; then
            echo "构建产物不存在、为空或不可执行：$executable" >&2
            ls -la "$output"
            exit 1
          fi
          readelf -h "$executable"
          shopt -s nullglob
          packages=("$output"/*.deb)
          if [[ ${#packages[@]} -ne 1 ]]; then
            echo "预期生成一个 deb，实际数量为 ${#packages[@]}" >&2
            exit 1
          fi
          dpkg-deb --info "${packages[0]}"
          dpkg-deb --contents "${packages[0]}"
          mkdir -p artifacts
          cp "${packages[0]}" "artifacts/$WAILS_MAJOR-$BUILD_OS-amd64.deb"
          # GitHub 构建产物 ZIP 不保留可执行权限，因此使用 tar.gz 封装单文件程序。
          tar -czf "artifacts/$WAILS_MAJOR-$BUILD_OS-amd64-standalone.tar.gz" \
            -C "$output" "$executable_name"

      - name: 上传单文件程序和安装包
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.wails }}-${{ matrix.os }}-amd64
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: 汇总产物并发布 Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TARGET: ${{ github.sha }}
      V2_REF: ${{ inputs.v2_ref }}
      V3_REF: ${{ inputs.v3_ref }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: 按北京时间生成发布标签
        shell: bash
        run: echo "RELEASE_TAG=$(TZ=Asia/Shanghai date +v%Y.%m.%d)" >> "$GITHUB_ENV"

      - name: 下载本次运行的六组构建产物
        uses: actions/download-artifact@v4
        with:
          pattern: v*-*-amd64
          path: release-assets
          merge-multiple: true

      - name: 校验十二个发布附件并生成校验和
        shell: bash
        run: |
          git check-ref-format "refs/tags/$RELEASE_TAG"
          for version in v2 v3; do
            test -s "release-assets/$version-windows-amd64.exe"
            test -s "release-assets/$version-windows-amd64-installer.exe"
            for system in ubuntu-22.04 ubuntu-24.04; do
              test -s "release-assets/$version-$system-amd64.deb"
              test -s "release-assets/$version-$system-amd64-standalone.tar.gz"
            done
          done
          cd release-assets
          sha256sum -- *.exe *.deb *.tar.gz > SHA256SUMS.txt

      - name: 删除当天已有的 Release 和标签
        uses: actions/github-script@v7
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            if (!/^v\d{4}\.\d{2}\.\d{2}$/.test(tag)) {
              throw new Error(`发布标签格式不正确：${tag}`);
            }
            const repo = context.repo;
            let previous;
            try {
              previous = await github.rest.repos.getReleaseByTag({ ...repo, tag });
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (previous) {
              await github.rest.repos.deleteRelease({ ...repo, release_id: previous.data.id });
              core.info(`已删除当天旧 Release 及其附件：${tag}`);
            }
            // 同名标签也重新创建，确保指向本次工作流提交；处理上次失败留下的孤立标签。
            let previousTag;
            try {
              previousTag = await github.rest.git.getRef({ ...repo, ref: `tags/${tag}` });
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (previousTag) {
              await github.rest.git.deleteRef({ ...repo, ref: `tags/${tag}` });
              core.info(`已删除旧标签：${tag}`);
            }

      - name: 创建当天草稿、上传完整附件后正式发布
        shell: bash
        run: |
          {
            printf '本次发布包含 Wails v2 和 v3 的 amd64 程序及安装包。\n\n'
            printf -- '- Windows：单文件 EXE、NSIS 安装包。\n'
            printf -- '- Ubuntu 22.04 / 24.04：deb、保留可执行权限的单文件 tar.gz。\n'
            printf -- '- SHA256SUMS.txt：附件 SHA-256 校验和。\n\n'
            printf 'v2 构建引用：`%s`\n\nv3 构建引用：`%s`\n\n' "$V2_REF" "$V3_REF"
            printf '各任务实际构建的后端和前端提交见[构建记录](%s)。\n' "$RUN_URL"
            printf '\n发布标签默认指向本次工作流提交 `%s`；各版本源码以构建记录为准。\n' "$RELEASE_TARGET"
          } > release-notes.md
          # 上传失败时保留草稿，避免对外发布缺少附件的 Release。
          gh release create "$RELEASE_TAG" release-assets/* \
            --target "$RELEASE_TARGET" --title "$RELEASE_TAG" \
            --notes-file release-notes.md --draft
          gh release edit "$RELEASE_TAG" --draft=false
          gh release view "$RELEASE_TAG" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
