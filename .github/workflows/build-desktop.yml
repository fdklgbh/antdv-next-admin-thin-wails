name: 构建 Wails v2 和 v3 安装包

on:
  workflow_dispatch:
    inputs:
      v3_ref:
        description: 'v3 分支、标签或提交'
        required: true
        default: master
        type: string
      v2_ref:
        description: 'v2 分支、标签或提交'
        required: true
        default: wailsv2
        type: string

permissions:
  contents: read

jobs:
  build:
    name: 构建 ${{ matrix.wails }} / ${{ matrix.os }} / amd64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        wails: [v2, v3]
        os: [windows-2022, ubuntu-22.04, ubuntu-24.04]
    defaults:
      run:
        shell: bash
    env:
      CI: 'true'
      # 固定构建工具版本；Wails CLI 和 Go 版本取自所选代码的 go.mod。
      TASK_VERSION: v3.51.1
      WAILS_MAJOR: ${{ matrix.wails }}
      BUILD_OS: ${{ matrix.os }}
      GIT_COMMITTER_NAME: ${{ github.repository_owner }}
      GIT_COMMITTER_EMAIL: ${{ github.repository_owner }}@users.noreply.github.com

    steps:
      - name: 检出指定版本及固定提交的公开子模块
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.wails == 'v3' && inputs.v3_ref || inputs.v2_ref }}
          submodules: recursive
          # 未提供 ssh-key 时，checkout 会将 GitHub 子模块的 SSH 地址转换为 HTTPS。
          persist-credentials: false

      - name: 按 go.mod 配置 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 配置 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
          run_install: false

      - name: 获取 pnpm 缓存目录
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: 缓存前端依赖
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-11-${{ hashFiles('frontend/pnpm-lock.yaml', 'frontend/pnpm-workspace.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-${{ runner.arch }}-11-

      - name: 安装 Linux 构建和打包依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config python3 dpkg-dev binutils
          if [[ "$WAILS_MAJOR" == v3 && "$BUILD_OS" == ubuntu-24.04 ]]; then
            sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev
          else
            sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev
          fi

      - name: 安装 Windows 安装包工具
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $nsisPath = Join-Path ${env:ProgramFiles(x86)} 'NSIS'
          if (-not (Test-Path (Join-Path $nsisPath 'makensis.exe'))) {
            choco install nsis --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'NSIS 安装失败' }
          }
          if (-not (Test-Path (Join-Path $nsisPath 'makensis.exe'))) {
            throw '安装 NSIS 后未找到 makensis.exe'
          }
          $nsisPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: 安装 Task 和匹配版本的 Wails CLI
        run: |
          go install "github.com/go-task/task/v3/cmd/task@$TASK_VERSION"
          wails_module="github.com/wailsapp/wails/$WAILS_MAJOR"
          wails_version=$(go list -m -f '{{.Version}}' "$wails_module")
          if [[ "$WAILS_MAJOR" == v3 ]]; then
            go install "$wails_module/cmd/wails3@$wails_version"
          else
            go install "$wails_module/cmd/wails@$wails_version"
          fi
          task --version
          {
            echo "### $WAILS_MAJOR / $BUILD_OS / amd64"
            echo "- 后端提交： $(git rev-parse HEAD)"
            echo "- 前端提交： $(git -C frontend rev-parse HEAD)"
            echo "- Wails CLI 版本： $wails_version"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 按锁文件安装前端依赖
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: 构建单文件程序和安装包
        run: |
          if [[ "$WAILS_MAJOR" == v2 ]]; then
            task build:package
          elif [[ "$RUNNER_OS" == Windows ]]; then
            task package
          else
            # Taskfile 为 Ubuntu 22.04 选择 GTK3，为 24.04 选择 GTK4。
            task linux:create:deb
          fi

      - name: 检查前端类型
        working-directory: frontend
        run: pnpm run type-check

      - name: 收集 Windows 单文件 EXE 和 NSIS 安装包
        if: runner.os == 'Windows'
        run: |
          output=bin
          if [[ "$WAILS_MAJOR" == v2 ]]; then output=build/bin; fi
          executable="$output/antdv-next-admin-thin-wails.exe"
          installer="$output/antdv-next-admin-thin-wails-amd64-installer.exe"
          test -s "$executable"
          test -s "$installer"
          mkdir -p artifacts
          cp "$executable" "artifacts/$WAILS_MAJOR-windows-amd64.exe"
          cp "$installer" "artifacts/$WAILS_MAJOR-windows-amd64-installer.exe"

      - name: 检查 deb 并收集 Linux 单文件程序
        if: runner.os == 'Linux'
        run: |
          output=bin
          if [[ "$WAILS_MAJOR" == v2 ]]; then output=build/bin; fi
          executable="$output/antdv-next-admin-thin-wails"
          test -s "$executable"
          test -x "$executable"
          readelf -h "$executable"
          shopt -s nullglob
          packages=("$output"/*.deb)
          if [[ ${#packages[@]} -ne 1 ]]; then
            echo "预期生成一个 deb，实际数量为 ${#packages[@]}" >&2
            exit 1
          fi
          dpkg-deb --info "${packages[0]}"
          dpkg-deb --contents "${packages[0]}"
          mkdir -p artifacts
          cp "${packages[0]}" "artifacts/$WAILS_MAJOR-$BUILD_OS-amd64.deb"
          # GitHub 构建产物 ZIP 不保留可执行权限，因此使用 tar.gz 封装单文件程序。
          tar -czf "artifacts/$WAILS_MAJOR-$BUILD_OS-amd64-standalone.tar.gz" \
            -C "$output" antdv-next-admin-thin-wails

      - name: 上传单文件程序和安装包
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.wails }}-${{ matrix.os }}-amd64
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
