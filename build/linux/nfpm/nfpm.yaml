# Feel free to remove those if you don't want/need to use them.
# Make sure to check the documentation at https://nfpm.goreleaser.com
#
# The lines below are called `modelines`. See `:help modeline`

name: "${APP_NAME}"
arch: ${GOARCH}
platform: "linux"
version: "${APP_VERSION}"
section: "default"
priority: "extra"
maintainer: "${APP_MAINTAINER}"
description: "${APP_DESCRIPTION}"
vendor: "${APP_VENDOR}"
homepage: "${APP_HOMEPAGE}"
license: "MIT"
release: "${APP_RELEASE}"

contents:
  - src: "./${APP_BIN_DIR}/${APP_NAME}"
    dst: "/usr/bin/${APP_NAME}"
    expand: true
  - src: "./build/appicon.png"
    dst: "/usr/share/icons/hicolor/1024x1024/apps/${APP_NAME}.png"
    expand: true
  - src: "./build/appicon.png"
    dst: "/usr/share/pixmaps/${APP_NAME}.png"
    expand: true
  - src: "./build/linux/${APP_NAME}.desktop"
    dst: "/usr/share/applications/${APP_NAME}.desktop"
    expand: true

# Default dependencies for the GTK4 + WebKitGTK 6.0 stack (Ubuntu 24.04+ / Debian 13+)
depends:
  - libgtk-4-1
  - libwebkitgtk-6.0-4

# Distribution-specific overrides for different package formats
overrides:
  # RPM packages for Fedora / RHEL / AlmaLinux / Rocky Linux
  rpm:
    depends:
      - gtk4
      - webkitgtk6.0

  # Arch Linux packages
  archlinux:
    depends:
      - gtk4
      - webkitgtk-6.0

# scripts section to ensure desktop database is updated after install
scripts:
  postinstall: "./build/linux/nfpm/scripts/postinstall.sh"
  # You can also add preremove, postremove if needed
  # preremove: "./build/linux/nfpm/scripts/preremove.sh"
  # postremove: "./build/linux/nfpm/scripts/postremove.sh"

# Ubuntu 22.04 使用单独的 nfpm-gtk3.yaml，由 Linux Taskfile 自动选择。
