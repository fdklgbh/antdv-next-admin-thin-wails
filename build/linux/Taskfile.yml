version: '3.51.1'

# nFPM 只对其支持的字段和 contents 路径展开环境变量。
env:
  APP_NAME: '{{.APP_NAME}}'
  APP_VERSION: '{{.APP_VERSION}}'
  APP_DESCRIPTION: '{{.APP_DESCRIPTION}}'
  APP_VENDOR: '{{.APP_VENDOR}}'
  APP_HOMEPAGE: '{{.APP_HOMEPAGE}}'
  APP_MAINTAINER: '{{.APP_MAINTAINER}}'
  APP_RELEASE: '{{.APP_RELEASE}}'
  APP_BIN_DIR: '{{.BIN_DIR}}'

includes:
  common: ../Taskfile.yml

vars:
  # Signing 配置 - 根据项目修改这些值
  # PGP_KEY: "path/to/signing-key.asc"
  # SIGN_ROLE: "builder"  # 可选值：origin, maint, archive, builder
  #
  # Password 会安全存储在 system keychain 中。运行：wails3 setup signing

  # 用于 cross-compilation 的 Docker image（在非 Linux 环境或没有可用 CC 时使用）
  CROSS_IMAGE: wails-cross
  # Ubuntu 22.04 使用 GTK3；24.04 及其他环境保留 Wails 默认 GTK4。
  # 交叉编译时可显式指定 GTK_VERSION=3 或 4（不改变 Docker 的系统库基线）。
  GTK_VERSION:
    sh: |
      {{if eq OS "linux"}}
      . /etc/os-release
      if [ "$ID" = "ubuntu" ] && [ "$VERSION_ID" = "22.04" ]; then
        echo 3
      else
        echo 4
      fi
      {{else}}
      echo 4
      {{end}}
  LINUX_TAGS: '{{if eq .GTK_VERSION "3"}}gtk3{{if .EXTRA_TAGS}},{{end}}{{end}}{{.EXTRA_TAGS}}'
  NFPM_CONFIG: './build/linux/nfpm/{{if eq .GTK_VERSION "3"}}nfpm-gtk3{{else}}nfpm{{end}}.yaml'


tasks:
  build:
    summary: 构建 Linux 应用程序（Ubuntu 22.04 使用 GTK3，24.04 使用 GTK4）
    preconditions:
      - sh: 'test "{{.GTK_VERSION}}" = "3" || test "{{.GTK_VERSION}}" = "4"'
        msg: GTK_VERSION 必须为 3 或 4
      - sh: '{{if and (ne .GTK_VERSION "3") (contains "gtk3" (.EXTRA_TAGS | default ""))}}false{{else}}true{{end}}'
        msg: 请使用 GTK_VERSION=3 选择 GTK3，以同步安装包依赖
    cmds:
      # Linux 需要 CGO，以下情况使用 Docker：
      # 1. 从非 Linux 环境进行 cross-compilation，或
      # 2. 没有可用的 C compiler，或
      # 3. 目标 architecture 与主机 architecture 不同（cross-arch compilation）
      - task: '{{if and (eq OS "linux") (eq .HAS_CC "true") (eq .TARGET_ARCH ARCH)}}build:native{{else}}build:docker{{end}}'
        vars:
          ARCH: '{{.ARCH}}'
          DEV: '{{.DEV}}'
          OUTPUT: '{{.OUTPUT}}'
          EXTRA_TAGS: '{{.EXTRA_TAGS}}'
          OBFUSCATED: '{{.OBFUSCATED}}'
          GARBLE_ARGS: '{{.GARBLE_ARGS}}'
    vars:
      DEFAULT_OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}'
      OUTPUT: '{{ .OUTPUT | default .DEFAULT_OUTPUT }}'
      # 确定目标 architecture（未指定时默认为主机 ARCH）
      TARGET_ARCH: '{{.ARCH | default ARCH}}'
      # 检查是否有可用的 C compiler（gcc 或 clang），通过 wails3 tool 跨平台执行
      HAS_CC:
        sh: 'wails3 tool has "gcc|clang"'

  build:native:
    summary: 在 Linux 上原生构建应用程序
    internal: true
    deps:
      - task: common:go:mod:tidy
      - task: common:build:frontend
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
          OBFUSCATED:
            ref: .OBFUSCATED
          DEV:
            ref: .DEV
      - task: common:generate:icons
      - task: generate:dotdesktop
    preconditions:
      - sh: '{{if eq .OBFUSCATED "true"}}command -v garble >/dev/null 2>&1{{else}}true{{end}}'
        msg: "garble is required for obfuscated builds. Install it with: go install mvdan.cc/garble@v0.16.0 (requires Go 1.24+). See https://github.com/burrowers/garble/releases for version/toolchain compatibility."
    cmds:
      - '{{if eq .OBFUSCATED "true"}}garble {{.GARBLE_ARGS}} build{{else}}go build{{end}} {{.BUILD_FLAGS}} -o {{.OUTPUT}}'
    vars:
      BUILD_FLAGS: '{{if eq .DEV "true"}}{{if or .LINUX_TAGS (eq .OBFUSCATED "true")}}-tags {{if eq .OBFUSCATED "true"}}wails_obfuscated{{if .LINUX_TAGS}},{{end}}{{end}}{{.LINUX_TAGS}} {{end}}-buildvcs=false -gcflags=all="-l"{{else}}-tags production{{if eq .OBFUSCATED "true"}},wails_obfuscated{{end}}{{if .LINUX_TAGS}},{{.LINUX_TAGS}}{{end}} -trimpath -buildvcs=false -ldflags="-w -s"{{end}}'
      DEFAULT_OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}'
      OUTPUT: '{{ .OUTPUT | default .DEFAULT_OUTPUT }}'
    env:
      GOOS: linux
      CGO_ENABLED: 1
      GOARCH: '{{.ARCH | default ARCH}}'

  build:docker:
    summary: 使用 Docker 为 Linux 构建（用于非 Linux 主机或没有可用 C compiler 时）
    internal: true
    deps:
      - task: common:build:frontend
        vars:
          OBFUSCATED:
            ref: .OBFUSCATED
      - task: common:generate:icons
      - task: generate:dotdesktop
    preconditions:
      - sh: docker info > /dev/null 2>&1
        msg: "Docker is required for cross-compilation to Linux. Please install Docker."
      - sh: docker image inspect {{.CROSS_IMAGE}} > /dev/null 2>&1
        msg: |
          Docker image '{{.CROSS_IMAGE}}' not found.
          Build it first: wails3 task setup:docker
    cmds:
      - docker run --rm -v "{{.ROOT_DIR}}:/app" {{.DOCKER_MOUNTS}} -e APP_NAME="{{.APP_NAME}}" {{if .LINUX_TAGS}}-e EXTRA_TAGS="{{.LINUX_TAGS}}"{{end}} {{if eq .OBFUSCATED "true"}}-e OBFUSCATED=true{{end}} {{if .GARBLE_ARGS}}-e GARBLE_ARGS="{{.GARBLE_ARGS}}"{{end}} "{{.CROSS_IMAGE}}" linux {{.DOCKER_ARCH}}
      - cmd: docker run --rm -v "{{.ROOT_DIR}}:/app" alpine chown -R $(id -u):$(id -g) /app/bin
        platforms: [linux, darwin]
      - mkdir -p {{.BIN_DIR}}
      - mv "bin/{{.APP_NAME}}-linux-{{.DOCKER_ARCH}}" "{{.OUTPUT}}"
    vars:
      DOCKER_ARCH: '{{.ARCH | default "amd64"}}'
      DEFAULT_OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}'
      OUTPUT: '{{ .OUTPUT | default .DEFAULT_OUTPUT }}'
      # 生成 Docker volume mounts：Go module cache + go.mod replace directives
      # 使用 wails3 tool docker-mounts 实现跨平台兼容（Windows/Linux/macOS）
      DOCKER_MOUNTS:
        sh: 'wails3 tool docker-mounts'

  package:
    summary: 为 Linux 打包应用程序
    deps:
      - task: build
    cmds:
      - task: create:appimage
      - task: create:deb
      - task: create:rpm
      - task: create:aur

  create:appimage:
    summary: 创建 AppImage
    dir: build/linux/appimage
    deps:
      - task: build
      - task: generate:dotdesktop
    cmds:
      - cp "{{.APP_BINARY}}" "{{.APP_NAME}}"
      - cp ../../appicon.png "{{.APP_NAME}}.png"
      - wails3 generate appimage -binary "{{.APP_NAME}}" -icon {{.ICON}} -desktopfile {{.DESKTOP_FILE}} -outputdir {{.OUTPUT_DIR}} -builddir {{.ROOT_DIR}}/build/linux/appimage/build
    vars:
      APP_NAME: '{{.APP_NAME}}'
      APP_BINARY: '../../../bin/{{.APP_NAME}}'
      ICON: '{{.APP_NAME}}.png'
      DESKTOP_FILE: '../{{.APP_NAME}}.desktop'
      OUTPUT_DIR: '../../../bin'

  create:deb:
    summary: 创建 deb package
    deps:
      - task: build
    cmds:
      - task: generate:dotdesktop
      - task: generate:deb

  create:rpm:
    summary: 创建 rpm package
    deps:
      - task: build
    cmds:
      - task: generate:dotdesktop
      - task: generate:rpm

  create:aur:
    summary: 创建 Arch Linux package
    deps:
      - task: build
    cmds:
      - task: generate:dotdesktop
      - task: generate:aur

  generate:deb:
    env:
      GOARCH: '{{.ARCH | default ARCH}}'
    summary: 创建 deb package
    cmds:
      - task: generate:apparmor
      - wails3 tool package -name "{{.APP_NAME}}" -format deb -config "{{.NFPM_CONFIG}}" -out {{.ROOT_DIR}}/bin

  generate:apparmor:
    desc: 生成 GTK4 deb 的应用专用 AppArmor 规则
    # GTK3 包不携带 AppArmor 4 语法，保持 Ubuntu 22.04 兼容。
    status:
      - '{{if eq .GTK_VERSION "3"}}true{{else}}false{{end}}'
    preconditions:
      - sh: |
          case "$APP_NAME" in
            ''|*[!a-z0-9+.-]*) exit 1 ;;
          esac
        msg: APP_NAME 必须使用 Debian 包名允许的小写字母、数字、加号、点或连字符
    cmds:
      - mkdir -p "{{.ROOT_DIR}}/{{.BIN_DIR}}"
      - 'echo {{.PROFILE | shellQuote}} > "{{.ROOT_DIR}}/{{.BIN_DIR}}/{{.APP_NAME}}.apparmor"'
    vars:
      PROFILE: |
        abi <abi/4.0>,
        include <tunables/global>

        profile {{.APP_NAME}}-installed "/usr/bin/{{.APP_NAME}}" flags=(unconfined) {
          userns,
        }

  generate:rpm:
    env:
      GOARCH: '{{.ARCH | default ARCH}}'
    summary: 创建 rpm package
    cmds:
      - wails3 tool package -name "{{.APP_NAME}}" -format rpm -config "{{.NFPM_CONFIG}}" -out {{.ROOT_DIR}}/bin

  generate:aur:
    env:
      GOARCH: '{{.ARCH | default ARCH}}'
    summary: 创建 Arch Linux package
    cmds:
      - wails3 tool package -name "{{.APP_NAME}}" -format archlinux -config "{{.NFPM_CONFIG}}" -out {{.ROOT_DIR}}/bin

  generate:dotdesktop:
    summary: 生成 `.desktop` 文件
    dir: build
    cmds:
      - mkdir -p {{.ROOT_DIR}}/build/linux/appimage
      - wails3 generate .desktop -name {{.DISPLAY_NAME | shellQuote}} -comment {{.APP_DESCRIPTION | shellQuote}} -exec "{{.EXEC}}" -icon "{{.ICON}}" -outputfile "{{.ROOT_DIR}}/build/linux/{{.APP_NAME}}.desktop" -categories {{.CATEGORIES | shellQuote}}
    vars:
      APP_NAME: '{{.APP_NAME}}'
      EXEC: '{{.APP_NAME}}'
      ICON: '{{.APP_NAME}}'
      CATEGORIES: '{{.DESKTOP_CATEGORIES}}'
      OUTPUTFILE: '{{.ROOT_DIR}}/build/linux/{{.APP_NAME}}.desktop'

  run:
    cmds:
      - '{{.BIN_DIR}}/{{.APP_NAME}}'

  sign:deb:
    desc: 使用 PGP 密钥签署 DEB 安装包
    summary: |
      设置 PGP_KEY 可覆盖 wails3 setup 的全局密钥配置（~/.config/wails/defaults.yaml）。
      密码从系统凭据存储读取，使用 wails3 setup signing 配置。
    deps:
      - task: create:deb
    cmds:
      # PGP_KEY 可选：未设置时，`wails3 tool sign` 使用通过 `wails3 setup`
      # 全局配置的 key。
      - wails3 tool sign --input "{{.BIN_DIR}}/{{.APP_NAME}}*.deb" {{if .PGP_KEY}}--pgp-key "{{.PGP_KEY}}"{{end}} {{if .SIGN_ROLE}}--role "{{.SIGN_ROLE}}"{{end}}

  sign:rpm:
    desc: 使用 PGP 密钥签署 RPM 安装包
    summary: |
      设置 PGP_KEY 可覆盖 wails3 setup 的全局密钥配置（~/.config/wails/defaults.yaml）。
      密码从系统凭据存储读取，使用 wails3 setup signing 配置。
    deps:
      - task: create:rpm
    cmds:
      - wails3 tool sign --input "{{.BIN_DIR}}/{{.APP_NAME}}*.rpm" {{if .PGP_KEY}}--pgp-key "{{.PGP_KEY}}"{{end}}

  sign:packages:
    desc: 使用 PGP 密钥签署 DEB 和 RPM 安装包
    summary: |
      设置 PGP_KEY 可覆盖 wails3 setup 的全局密钥配置（~/.config/wails/defaults.yaml）。
      密码从系统凭据存储读取，使用 wails3 setup signing 配置。
    cmds:
      - task: sign:deb
      - task: sign:rpm
