# 使用独立 Task 3.51.1+；通过 Task 自带的版本检查限制最低版本。
version: '3.51.1'

vars:
  PROJECT_CONFIG:
    sh: cat '{{.ROOT_DIR}}/build/config.yml'
  APP_NAME: '{{(mustFromYaml .PROJECT_CONFIG).packaging.appName}}'
  DISPLAY_NAME: '{{(mustFromYaml .PROJECT_CONFIG).info.productName}}'
  APP_VERSION: '{{(mustFromYaml .PROJECT_CONFIG).info.version}}'
  APP_DESCRIPTION: '{{(mustFromYaml .PROJECT_CONFIG).info.description}}'
  APP_VENDOR: '{{(mustFromYaml .PROJECT_CONFIG).info.companyName}}'
  APP_COPYRIGHT: '{{(mustFromYaml .PROJECT_CONFIG).info.copyright}}'
  APP_COMMENTS: '{{(mustFromYaml .PROJECT_CONFIG).info.comments}}'
  APP_HOMEPAGE: '{{(mustFromYaml .PROJECT_CONFIG).packaging.homepage}}'
  APP_MAINTAINER: '{{(mustFromYaml .PROJECT_CONFIG).packaging.maintainer}}'
  APP_RELEASE: '{{(mustFromYaml .PROJECT_CONFIG).packaging.release}}'
  DESKTOP_CATEGORIES: '{{(mustFromYaml .PROJECT_CONFIG).packaging.categories}}'
  BIN_DIR: "bin"
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "pnpm"}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # build/package/run 的目标 OS。默认使用当前主机 OS；跨平台编译时可通过
  # `task build GOOS=...`（或 GOOS 环境变量）覆盖。下面的 task 会通过此变量
  # 分发到对应平台的 Taskfile。
  GOOS: '{{.GOOS | default OS}}'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml
  ios: ./build/ios/Taskfile.yml
  android: ./build/android/Taskfile.yml

tasks:
  config:show:
    summary: 输出构建名称和产物目录（JSON，供 CI 使用）
    cmds:
      - 'echo {{dict "appName" .APP_NAME "binDir" .BIN_DIR | toJson | shellQuote}}'

  build:
    summary: 构建应用
    cmds:
      - task: "{{.GOOS}}:build"

  package:
    summary: 打包应用的 production 构建
    cmds:
      - task: "{{.GOOS}}:package"

  run:
    summary: 运行应用
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    summary: 以 development 模式运行应用
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  setup:docker:
    summary: 构建用于 cross-compilation 的 Docker image（约 800MB 下载）
    cmds:
      - task: common:setup:docker

  build:server:
    summary: 以 server 模式构建应用（无 GUI，仅 HTTP server）
    cmds:
      - task: common:build:server

  run:server:
    summary: 以 server 模式运行应用
    cmds:
      - task: common:run:server

  build:docker:
    summary: 构建用于 server 模式部署的 Docker image
    cmds:
      - task: common:build:docker

  run:docker:
    summary: 构建并运行 Docker image
    cmds:
      - task: common:run:docker
